controller_manager:
  ros__parameters:
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    iiwa_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

iiwa_arm_controller:
  ros__parameters:
    joints:
      - lbr_iiwa_joint_1
      - lbr_iiwa_joint_2
      - lbr_iiwa_joint_3
      - lbr_iiwa_joint_4
      - lbr_iiwa_joint_5
      - lbr_iiwa_joint_6
      - lbr_iiwa_joint_7

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

